"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 2500

format = """
$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$java$package$docker_context$kubernetes$aws$terraform$time
$character"""

right_format = """$status$cmd_duration$jobs"""

[character]
success_symbol = "[❯](bold #50fa7b)"
error_symbol = "[❯](bold #ff5555)"
vimcmd_symbol = "[❯](bold #ffff55)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #50fa7b"

[git_branch]
symbol = " "
style = "bold #55ffff"

[git_status]
style = "bold #50fa7b"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
staged = "[+${count}](bold #50fa7b)"
modified = "[~${count}](bold #50fa7b)"
untracked = "[?${count}](bold #ff5555)"
deleted = "[-${count}](bold #ff5555)"
stashed = "[*${count}](bold #7aa2f7)"

[python]
symbol = " "
format = '[$symbol(${version} )(\($virtualenv\) )](bold #ffff55)'
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version", "Pipfile"]
detect_folders = [".venv", "venv"]

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold #50fa7b"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold #ff5555"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold #55ffff"

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold #7aa2f7"

[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
style = "bold #ffb86c"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold #7aa2f7"

[kubernetes]
symbol = "󱃾 "
format = '[$symbol$context( \($namespace\))]($style) '
style = "bold #55ffff"
disabled = false

[aws]
symbol = " "
format = '[$symbol($profile )(\\($region\\) )]($style)'
style = "bold #ffff55"
disabled = false

[terraform]
symbol = "󱁢 "
format = "[$symbol$workspace]($style) "
style = "bold #bd93f9"

[status]
disabled = false
symbol = " "
style = "bold #ff5555"

[cmd_duration]
min_time = 2_000
format = "[$duration](bold #ffff55) "

[jobs]
symbol = "󰒋 "
style = "bold #7aa2f7"

[time]
disabled = false
format = "at [$time]($style) "
time_format = "%H:%M"
style = "#ffffff"

[hostname]
ssh_only = true
format = "[$hostname@ssh]($style) "
style = "bold #ff5555"
disabled = false
