
if '[ -x "$HOME/.config/tmux/scripts/persist_save_guard.sh" ]' {
	set-hook -g client-detached 'run-shell "$HOME/.config/tmux/scripts/persist_save_guard.sh quiet all"'
	set-hook -g session-closed   'run-shell "$HOME/.config/tmux/scripts/persist_save_guard.sh quiet all"'
}
if '[ -x "$HOME/.config/tmux/scripts/persist_restore_guard.sh" ]' {
	set-hook -g session-created  'run-shell "$HOME/.config/tmux/scripts/persist_restore_guard.sh #{hook_session_name} quiet"'
}
