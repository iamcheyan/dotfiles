
set -g @resurrect-save-script-path '$HOME/.config/tmux/scripts/continuum_save_wrapper.sh'
set -g @resurrect-restore-script-path '$HOME/.config/tmux/plugins/tmux-persist/scripts/restore.sh'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @persist-processes 'fresh ~fresh ~fresh-editor ~fresh-wrapped ~codex ~omp ~pi grok kiro-cli'
set -g @persist-hook-pre-restore-pane-processes '$HOME/.config/tmux/scripts/pre-restore-agents.sh'
