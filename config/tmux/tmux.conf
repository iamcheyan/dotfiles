# 256色支持和真彩色 (Truecolor / RGB) 支持
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set -g status-style "bg=#13a10e,fg=#000000"
#
# 开启鼠标支持
set -g mouse on

# Vim 风格复制模式
setw -g mode-keys vi

# 窗口和 pane 从 1 开始编号
set -g base-index 1
setw -g pane-base-index 1

# 自动重编号窗口
set -g renumber-windows on

# 增加历史记录行数
set -g history-limit 200000

# 减少 Escape 延迟
set -sg escape-time 0

# 开启焦点事件
set -g focus-events on

# 新窗口保持当前路径
bind c new-window -c "#{pane_current_path}"

set -g automatic-rename-format '#{b:pane_current_path}'

set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour236

# 扩展按键支持
set -g extended-keys on
set -g extended-keys-format csi-u

# 调整 pane 大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
#
# ==========================
# ===  插件管理 (TPM)  ===
# ==========================

# TPM 插件管理器
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# 私有机器设置由 chezmoi 管理的 ~/.config/tmux/private.conf 提供。
if-shell '[ -f "$HOME/.config/tmux/private.conf" ]' 'source-file "$HOME/.config/tmux/private.conf"'

# tmux-yank
set -g @plugin 'tmux-plugins/tmux-yank'

# vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-fzf
set -g @plugin 'sainnhe/tmux-fzf'

# TPM 初始化
run '~/.tmux/plugins/tpm/tpm'

# 私有 TPM 后置钩子由 chezmoi 管理。
if-shell '[ -f "$HOME/.config/tmux/private-after.conf" ]' \
  'source-file "$HOME/.config/tmux/private-after.conf"'
