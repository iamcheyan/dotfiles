# 256色支持和真彩色 (Truecolor / RGB) 支持
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set -g status-style "bg=#13a10e,fg=#000000"
#
# 开启鼠标支持
set -g mouse on

# Vim 风格复制模式
setw -g mode-keys vi

# 窗口和 pane 从 1 开始编号
set -g base-index 1
setw -g pane-base-index 1

# 自动重编号窗口
set -g renumber-windows on

# 增加历史记录行数
set -g history-limit 200000

# 减少 Escape 延迟
set -sg escape-time 0

# 开启焦点事件
set -g focus-events on

# 新窗口保持当前路径
bind c new-window -c "#{pane_current_path}"

set -g automatic-rename-format '#{b:pane_current_path}'

set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour236

# 关闭 Kitty CSI-u 扩展按键协议。
#
# 远端 SSH 会话中的 tmux 可能把 Ctrl-J 等按键编码为 CSI-u（例如
# ESC [ 106 ; 5 u）；如果远端 shell/粘贴注入程序不理解该协议，序列
# 就会作为可见文本泄漏到命令行。普通 Ctrl/方向键仍使用兼容编码。
# 旧 shell 也可能把 Ctrl-J 显示为乱码。
set -g extended-keys off

# 调整 pane 大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 杀掉当前 session（大写 X，与小写 x = kill-pane 对称；带确认避免误按）
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
#
# ==========================
# ===  插件管理 (TPM)  ===
# ==========================

# TPM stores itself and all plugins under this configuration tree.
# Use run-shell so the shell expands HOME portably before TPM starts.
run-shell 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"'

# TPM 插件管理器
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-persist 针对 vim / nvim 的 session 恢复策略
set -g @persist-strategy-vim 'session'
set -g @persist-strategy-nvim 'session'

# 私有机器设置由 chezmoi 管理的 ~/.config/tmux/private.conf 提供。
if-shell '[ -f "$HOME/.config/tmux/private.conf" ]' {
  source-file "$HOME/.config/tmux/private.conf"
}

# tmux-yank
set -g @plugin 'tmux-plugins/tmux-yank'

# vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-fzf
set -g @plugin 'sainnhe/tmux-fzf'

# TPM 初始化
run '~/.config/tmux/plugins/tpm/tpm'

# 私有 TPM 后置钩子由 chezmoi 管理。
if-shell '[ -f "$HOME/.config/tmux/private-after.conf" ]' \
  'source-file "$HOME/.config/tmux/private-after.conf"'
