# 256色支持和真彩色 (Truecolor / RGB) 支持
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set -g status-style "bg=#13a10e,fg=#000000"
set -g status-right-length 90
set -g status-right '#{?client_prefix,[g]Git [T]Thumbs [Tab]Extrakto [e]Scrollback [N]Notify [B]Back [r]Reload,#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y}'
#
# 开启鼠标支持
set -g mouse on

# Vim 风格复制模式
setw -g mode-keys vi

# 窗口和 pane 从 1 开始编号
set -g base-index 1
setw -g pane-base-index 1

# 自动重编号窗口
set -g renumber-windows on

# 关闭某 session 最后一个窗口时不退出 tmux，而是自动切到其余活跃 session
set -g detach-on-destroy off

# 缩小分词分隔符（去掉 / . : - _ @），使鼠标双击能完整选中文件路径、URL 或标识符
set -g word-separators " ()[]{}<>\"'"

# base-index 只影响新建窗口；已有会话或 tmux-persist 恢复的会话可能仍停在
# 窗口 0。重新加载配置时按 base-index 统一重编号，保证底部窗口列表从 1 开始。
run-shell 'tmux list-sessions 2>/dev/null | cut -d: -f1 | while read -r s; do tmux move-window -r -t "$s:" 2>/dev/null || true; done'

# 增加历史记录行数
set -g history-limit 200000

# 开启焦点事件
set -g focus-events on

# Allow OSC 52 clipboard sequences through tmux to the outer terminal (SSH / nested tmux).
set -g allow-passthrough on
# tmux emits OSC 52 whenever it updates a buffer; this is required on remote SSH hops.
set -s set-clipboard on

# Forward SSH variables to newly created panes so the copy helper detects remote sessions.
set -ga update-environment "SSH_CLIENT SSH_CONNECTION SSH_TTY SSH_SESSION"

# 新窗口与分屏保持当前路径
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

set -g automatic-rename-format '#{b:pane_current_path}'

set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour236

# 关闭 Kitty CSI-u 扩展按键协议。
#
# 远端 SSH 会话中的 tmux 可能把 Ctrl-J 等按键编码为 CSI-u（例如
# ESC [ 106 ; 5 u）；如果远端 shell/粘贴注入程序不理解该协议，序列
# 就会作为可见文本泄漏到命令行。普通 Ctrl/方向键仍使用兼容编码。
# 旧 shell 也可能把 Ctrl-J 显示为乱码。
set -g extended-keys off

# 调整 pane 大小（Prefix + 大写 H/J/K/L）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 移动 pane 到窗口边缘（Prefix + 小写 h/j/k/l，与 Ctrl+h/j/k/l 切焦点、大写 H/J/K/L 调大小形成对应）
bind h if-shell -F "#{&&:#{pane_at_left},#{&&:#{pane_at_top},#{pane_at_bottom}}}" "" {
  run-shell 'tmux move-pane -s "#{pane_id}" -t "{#{?#{&&:#{pane_at_left},#{pane_at_top}},bottom-left,top-left}}" -hb -f'
}
bind l if-shell -F "#{&&:#{pane_at_right},#{&&:#{pane_at_top},#{pane_at_bottom}}}" "" {
  run-shell 'tmux move-pane -s "#{pane_id}" -t "{#{?#{&&:#{pane_at_right},#{pane_at_top}},bottom-right,top-right}}" -h -f'
}
bind k if-shell -F "#{&&:#{pane_at_top},#{&&:#{pane_at_left},#{pane_at_right}}}" "" {
  run-shell 'tmux move-pane -s "#{pane_id}" -t "{#{?#{&&:#{pane_at_top},#{pane_at_left}},top-right,top-left}}" -vb -f'
}
bind j if-shell -F "#{&&:#{pane_at_bottom},#{&&:#{pane_at_left},#{pane_at_right}}}" "" {
  run-shell 'tmux move-pane -s "#{pane_id}" -t "{#{?#{&&:#{pane_at_bottom},#{pane_at_left}},bottom-right,bottom-left}}" -v -f'
}

# 与已标记的 pane 互换位置（Prefix + S）、重启当前 pane（Prefix + Alt+r）
bind S if-shell -F "#{pane_marked_set}" "swap-pane" ""
bind M-r respawn-pane -k
# 重载当前配置（Prefix + r）
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# 在 Neovim 中打开当前 pane 的全部内容（Prefix + e，方便搜索、复制或编辑日志）
bind e run-shell 'tmp=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX.log") || exit 1; tmux capture-pane -p -J -S - -E - -t "#{pane_id}" | awk "{ lines[NR] = \$0; if (\$0 != \"\") last = NR } END { for (i = 1; i <= last; i++) print lines[i] }" > "$tmp"; tmux new-window -c "#{pane_current_path}" -n "scrollback" "nvim +\"normal! G\" -c \"nnoremap <buffer> <silent> q :q!<CR>\" \"$tmp\"; rm -f \"$tmp\""'

# 在最近使用的两个 session 之间来回秒切（Prefix + 大写 B，与小写 b 切最近 window 对称）
bind B switch-client -l

# 弹出居中浮动窗口：Lazygit（Prefix + g）与临时 Shell（Prefix + Alt+t）
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind M-t display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "$SHELL"

# 切换当前窗口所有分屏同步输入（Prefix + Ctrl+y）
bind C-y setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# 复制模式下按 [ / ] 在上一条/下一条 Shell 提示符之间跳转
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt

# 杀掉当前 session（大写 X，与小写 x = kill-pane 对称；带确认避免误按）
bind X confirm-before -p "Destroy session #S and its saved state? (y/n)" "run-shell '\"$HOME/dotfiles/scripts/tmux-destroy-session\" \"#{session_name}\"'"
#
# ==========================
# ===  插件管理 (TPM)  ===
# ==========================

# TPM stores itself and all plugins under this configuration tree.
# Use run-shell so the shell expands HOME portably before TPM starts.
run-shell 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"'

# TPM 插件管理器
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-persist 针对 vim / nvim 的 session 恢复策略
set -g @persist-strategy-vim 'session'
set -g @persist-strategy-nvim 'session'

# tmux-persist 按保存时的索引重建窗口，恢复后同样重编号，避免恢复出窗口 0。
set -g @persist-hook-post-restore-all 'tmux list-sessions 2>/dev/null | cut -d: -f1 | while read -r s; do tmux move-window -r -t "$s:" 2>/dev/null || true; done'

# 私有机器设置由 chezmoi 管理的 ~/.config/tmux/private.conf 提供。
if-shell '[ -f "$HOME/.config/tmux/private.conf" ]' {
  source-file "$HOME/.config/tmux/private.conf"
}

# tmux-yank
set -g @plugin 'tmux-plugins/tmux-yank'

# vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-fzf
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-thumbs：屏幕文本/路径/Hash 双字母快速标签（Prefix + T，避免抢占 Prefix + Space 切换布局）
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key T
set -g @thumbs-osc52 1

# extrakto：用 fzf 模糊搜索当前屏幕上的单词/路径/URL 并插入或复制（默认 Prefix + Tab）
set -g @plugin 'laktak/extrakto'
set -g @extrakto_clip_tool "$HOME/dotfiles/scripts/tmux-copy"
set -g @extrakto_clip_tool_run "fg"

# tmux-notify：后台分屏任务完成提醒（TPM 加载后改绑为 Prefix + N / Alt+N，保留 Prefix + m 标记分屏）
set -g @plugin 'rickstaa/tmux-notify'

# TPM 初始化
run '~/.config/tmux/plugins/tpm/tpm'

# Restore default mark-pane bindings (tmux-notify binds m/M by default)
# and bind tmux-notify to Prefix + N (monitor) and Prefix + M-N (cancel).
bind m select-pane -m
bind M select-pane -M
unbind M-m
unbind C-m
unbind C-M-m
bind N run-shell -b "$HOME/.config/tmux/plugins/tmux-notify/scripts/notify.sh"
bind M-N run-shell -b "$HOME/.config/tmux/plugins/tmux-notify/scripts/cancel.sh"

# 右键菜单（右侧显示真实的 ^b = Ctrl+b 快捷键提示，方便日常记忆）
bind -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" {
  select-pane -t =
  send-keys -M
} {
  display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
    "Close Pane          ^b x" "x" { kill-pane } \
    "Open In Nvim        ^b e" "e" { run-shell 'tmp=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX.log") || exit 1; tmux capture-pane -p -J -S - -E - -t "#{pane_id}" | awk "{ lines[NR] = \$0; if (\$0 != \"\") last = NR } END { for (i = 1; i <= last; i++) print lines[i] }" > "$tmp"; tmux new-window -c "#{pane_current_path}" -n "scrollback" "nvim +\"normal! G\" -c \"nnoremap <buffer> <silent> q :q!<CR>\" \"$tmp\"; rm -f \"$tmp\""' } \
    "Popup Lazygit       ^b g" "g" { display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit" } \
    "Popup Shell         ^b M-t" "" { display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "$SHELL" } \
    "#{?pane_synchronized,Disable Sync Panes  ^b C-y,Enable Sync Panes   ^b C-y}" "" { setw synchronize-panes ; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}" } \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } \
    "" \
    "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" "" { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward "#{q:mouse_word}" } \
    "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" "" { copy-mode -q ; send-keys -l "#{q:mouse_word}" } \
    "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" "" { copy-mode -q ; set-buffer "#{q:mouse_word}" } \
    "" \
    "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" "" { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } \
    "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" "" { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } \
    "" \
    "Horizontal Split    ^b %" "" { split-window -h -c "#{pane_current_path}" } \
    "Vertical Split      ^b \\\"" "" { split-window -v -c "#{pane_current_path}" } \
    "" \
    "#{?window_zoomed_flag,Unzoom              ^b z,Zoom                ^b z}" "" { resize-pane -Z } \
    "#{?pane_marked,Unmark              ^b m,Mark                ^b m}" "" { select-pane -m } \
    "#{?pane_marked_set,Swap Marked         ^b S,}" "" { swap-pane } \
    "" \
    "#{?pane_marked_set,Move Marked,}" "" { run-shell "tmux join-pane -s \"$(tmux list-panes -a -F \"##{?pane_marked,##{pane_id},}\" | grep -m1 .)\" -t =" } \
    "Move Left           ^b h" "" { run-shell "tmux move-pane -L -t =" } \
    "Move Right          ^b l" "" { run-shell "tmux move-pane -R -t =" } \
    "Move Up             ^b k" "" { run-shell "tmux move-pane -U -t =" } \
    "Move Down           ^b j" "" { run-shell "tmux move-pane -D -t =" } \
    "" \
    "Swap Up             ^b {" "" { swap-pane -U } \
    "Swap Down           ^b }" "" { swap-pane -D } \
    "Move Pane To Tab..." "" { choose-tree -Zw "join-pane -s \"#{pane_id}\" -t \"%%\"" } \
    "Next Layout         ^b Space" "" { next-layout } \
    "Break To Window     ^b !" "" { break-pane } \
    "" \
    "Kill                ^b x" "" { kill-pane } \
    "Respawn             ^b M-r" "" { respawn-pane -k } \
    "Reload Config       ^b r" "" { source-file ~/.config/tmux/tmux.conf \\; display-message "tmux config reloaded" }
  }

# Alt+right-click always opens the exact same tmux menu, even when the pane
# program captures normal mouse clicks (mouse_any_flag=1, e.g. nvim / TUI apps).
bind -T root M-MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
  "Close Pane          ^b x" "x" { kill-pane } \
  "Open In Nvim        ^b e" "e" { run-shell 'tmp=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX.log") || exit 1; tmux capture-pane -p -J -S - -E - -t "#{pane_id}" | awk "{ lines[NR] = \$0; if (\$0 != \"\") last = NR } END { for (i = 1; i <= last; i++) print lines[i] }" > "$tmp"; tmux new-window -c "#{pane_current_path}" -n "scrollback" "nvim +\"normal! G\" -c \"nnoremap <buffer> <silent> q :q!<CR>\" \"$tmp\"; rm -f \"$tmp\""' } \
  "Popup Lazygit       ^b g" "g" { display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit" } \
  "Popup Shell         ^b M-t" "" { display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "$SHELL" } \
  "#{?pane_synchronized,Disable Sync Panes  ^b C-y,Enable Sync Panes   ^b C-y}" "" { setw synchronize-panes ; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}" } \
  "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } \
  "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } \
  "" \
  "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" "" { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward "#{q:mouse_word}" } \
  "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" "" { copy-mode -q ; send-keys -l "#{q:mouse_word}" } \
  "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" "" { copy-mode -q ; set-buffer "#{q:mouse_word}" } \
  "" \
  "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" "" { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } \
  "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" "" { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } \
  "" \
  "Horizontal Split    ^b %" "" { split-window -h -c "#{pane_current_path}" } \
  "Vertical Split      ^b \\\"" "" { split-window -v -c "#{pane_current_path}" } \
  "" \
  "#{?window_zoomed_flag,Unzoom              ^b z,Zoom                ^b z}" "" { resize-pane -Z } \
  "#{?pane_marked,Unmark              ^b m,Mark                ^b m}" "" { select-pane -m } \
  "#{?pane_marked_set,Swap Marked         ^b S,}" "" { swap-pane } \
  "" \
  "#{?pane_marked_set,Move Marked,}" "" { run-shell "tmux join-pane -s \"$(tmux list-panes -a -F \"##{?pane_marked,##{pane_id},}\" | grep -m1 .)\" -t =" } \
  "Move Left           ^b h" "" { run-shell "tmux move-pane -L -t =" } \
  "Move Right          ^b l" "" { run-shell "tmux move-pane -R -t =" } \
  "Move Up             ^b k" "" { run-shell "tmux move-pane -U -t =" } \
  "Move Down           ^b j" "" { run-shell "tmux move-pane -D -t =" } \
  "" \
  "Swap Up             ^b {" "" { swap-pane -U } \
  "Swap Down           ^b }" "" { swap-pane -D } \
  "Move Pane To Tab..." "" { choose-tree -Zw "join-pane -s \"#{pane_id}\" -t \"%%\"" } \
  "Next Layout         ^b Space" "" { next-layout } \
  "Break To Window     ^b !" "" { break-pane } \
  "" \
  "Kill                ^b x" "" { kill-pane } \
  "Respawn             ^b M-r" "" { respawn-pane -k } \
  "Reload Config       ^b r" "" { source-file ~/.config/tmux/tmux.conf \\; display-message "tmux config reloaded" }

# 私有 TPM 后置钩子由 chezmoi 管理。
if-shell '[ -f "$HOME/.config/tmux/private-after.conf" ]' \
  'source-file "$HOME/.config/tmux/private-after.conf"'

# Resolve the public helper path and pass it to copy-pipe children.
run-shell 'CLIP="$HOME/dotfiles/scripts/tmux-copy"; [ -x "$CLIP" ] || CLIP="$HOME/.dotfiles/scripts/tmux-copy"; tmux set-environment -g TMUX_CLIPBOARD_COPY "$CLIP"'

# Route every copy-mode-vi clipboard path through the shared helper after TPM.
if-shell '[ -x "$HOME/dotfiles/scripts/tmux-copy" ] || [ -x "$HOME/.dotfiles/scripts/tmux-copy" ]' {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '$TMUX_CLIPBOARD_COPY'
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '$TMUX_CLIPBOARD_COPY'
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '$TMUX_CLIPBOARD_COPY'
  bind -T copy-mode-vi M-y send-keys -X copy-pipe-and-cancel '$TMUX_CLIPBOARD_COPY; tmux paste-buffer -p'
  bind -T copy-mode-vi '!' send-keys -X copy-pipe-and-cancel 'tr -d "\n" | $TMUX_CLIPBOARD_COPY'
  bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '$TMUX_CLIPBOARD_COPY'
  bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '$TMUX_CLIPBOARD_COPY'
}
