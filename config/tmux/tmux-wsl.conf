# ==========================================================
# ===  WSL (Windows Subsystem for Linux) 专属 tmux 覆盖  ===
# ==========================================================
#
# 本文件只在 WSL 环境中被主配置 ~/.config/tmux/tmux.conf 条件加载：
#   if-shell '...WSL 检测...' 'source-file ~/.config/tmux/tmux-wsl.conf'
# 非 WSL 环境（本机 Debian / macOS / 原生 Linux）不会加载本文件，
# 因此这里的调整不会改变非 WSL 环境的既有行为。
#
# 背景与根因（见 dotfiles/config/nvim/docs/guides/CAPS-LOCK.md）：
#   WSL 中每次调用 Windows 侧二进制都要跨越 interop 边界，
#   实测 powershell.exe 单次约 200~800ms；clip.exe 属同一类跨边界调用。
#   tmux-yank 在本机解析为 wl-copy，但在 WSL 会回退到 `cat | clip.exe`；
#   鼠标拖选释放时执行它，复制模式已退出而外部命令仍在排空，
#   终端查询应答（如 DSR 的 ESC [ * 3 ~）可能落到 zsh 行编辑器被回显，
#   表现为 prompt/状态栏间歇性乱码。同处设置的 escape-time 0 不缓冲
#   escape 序列，会放大这种竞争。

# --- 1. 复制命令：彻底移除 clip.exe，改用 win32yank.exe ---
#
# tmux-yank 通过 @override_copy_command 读取该值，并在其鼠标/键盘
# 复制绑定（含 MouseDragEnd1Pane）中使用；因此本文件必须在 tmux-yank
# 之后、TPM 初始化之前加载，否则覆盖不生效。
#
# win32yank.exe 由 dotfiles/init.sh 在 WSL 下自动安装到 ~/.local/bin
# 并保证该目录位于 PATH。-i 从 stdin 读取，--lf 使用 LF 换行，避免
# 在 Windows 剪贴板里多出 CR。
#
# 这里不再用 WSL_INTEROP 做二次判断：interop 被 /etc/wsl.conf 禁用时
# 该变量缺失，会漏掉覆盖并退回 clip.exe。
set -g @override_copy_command 'win32yank.exe -i --lf'

# 回退：win32yank.exe 缺失时不静默退化到 clip.exe，改用 WSLg 场景可用的
# wl-copy；两者都缺失时保持不设置，由 tmux-yank 自行处理。
if-shell '[ -z "$(command -v win32yank.exe)" ] && command -v wl-copy >/dev/null 2>&1' {
  set -g @override_copy_command 'wl-copy'
}

# --- 2. 鼠标保持开启 ---
#
# 复制链路已修正，不再需要靠关闭鼠标规避问题。
set -g mouse on

# --- 3. escape 序列缓冲：给终端应答留出被 tmux 完整消费的时间 ---
#
# 本机为 0（对 vim/Neovim 的 ESC 响应最好）。WSL 下终端应答与 prompt
# 重绘竞争，适当缓冲可显著降低序列被拆开送入内层程序的概率。
set -sg escape-time 25

# --- 4. 不要向 Windows 侧同步 tmux 内部剪贴板 ---
#
# 避免 tmux 的 OSC 52 同步与 Windows 剪贴板桥接互相触发额外往返。
set -g set-clipboard off

# --- 5. 扩展按键协议保持关闭 ---
#
# 扩展按键协议（CSI-u / Kitty Keyboard Protocol）在 WSL + 多层终端
# 转发下更容易出现序列解释不一致，保持关闭。
set -g extended-keys off
