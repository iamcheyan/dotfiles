# fnm
eval "$(fnm env --use-on-cd)"

# alias
alias ea="nvim $HOME/dotfiles/aliases.conf"
alias rp="realpath"
alias cr="clear"
alias fr="fresh"
alias nvim-update='bash "$HOME/dotfiles/scripts/update_nvim.sh"'

# function
reload() {
  exec zsh
}

# dotfiles 管理エイリアス
alias dotlink="bash ${HOME}/dotfiles/dotlink/dotlink"

# git
gc() {
  if [ -z "$1" ]; then
    echo "Usage: gc -m \"commit message\""
    return 1
  fi
  git add .
  git commit "$@"
}

# ssh (fzf 选择已有主机)
alias vssh='$HOME/dotfiles/plugins/sshfs/vssh.sh'

# ls > eza
if command -v eza >/dev/null 2>&1; then
    alias l="eza --icons --group-directories-first --sort=modified --reverse"
    alias ll="eza -lh --icons --group-directories-first --git --sort=modified --reverse"
    alias la="eza -a --icons --group-directories-first --sort=modified --reverse"
    alias lsd="eza -lha --no-permissions --no-user --time-style=relative --icons"
    alias lt="eza --tree --icons"
    alias lt1="lt --level=1"
    alias lt2="lt --level=2"
    alias lt3="lt --level=3"
    alias lt4="lt --level=4"
    alias lt5="lt --level=5"
fi

# 终止指定 TCP 端口的监听进程 (需要 lsof)
killport() {
  if [[ $# -ne 1 || ! "$1" =~ ^[0-9]+$ ]] || (( 10#$1 < 1 || 10#$1 > 65535 )); then
    echo 'Usage: killport <port 1-65535>' >&2
    return 1
  fi
  local pids
  pids=$(lsof -tiTCP:"$1" -sTCP:LISTEN -n -P 2>/dev/null)
  [[ -z "$pids" ]] && return 0
  echo "$pids" | xargs kill
}

# 交互式选择并切换 Git worktree
wt() {
  local dir
  dir=$(git worktree list --porcelain 2>/dev/null |
    awk '/^worktree / { sub(/^worktree /, ""); print }' |
    fzf --height=~20) || return
  [[ -n "$dir" ]] && cd -- "$dir"
}

# ranger
function ra {
  local tmpfile
  tmpfile="$(mktemp)"

  ranger --choosedir="$tmpfile" "${@:-$PWD}"

  if [ -f "$tmpfile" ]; then
    local newdir
    newdir="$(cat "$tmpfile")"
    [ -d "$newdir" ] && cd "$newdir"
    rm -f "$tmpfile"
  fi
}
